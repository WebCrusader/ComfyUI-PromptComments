[project]
name = "comfyui-promptcomments"
description = "Prompt text nodes for ComfyUI with commented-out lines: # and // line comments and /* */ blocks render in red and are stripped from the output."
version = "2.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
readme = "README.md"
keywords = ["comfyui", "comfyui-nodes", "prompt", "text", "comments"]
authors = [{ name = "Atanas Kosharov" }]
classifiers = [
  "Environment :: Plugins",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: JavaScript",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/WebCrusader/ComfyUI-PromptComments"

[tool.comfy]
# Your ComfyUI Registry publisher handle (the name after the @ on your registry
# profile). Permanent - it is the URL your nodes live under. The API key that
# authorises publishing is NOT stored here: `comfy node publish` prompts for it,
# and CI reads it from the REGISTRY_ACCESS_TOKEN repo secret.
PublisherId = "webcrusader"
DisplayName = "Prompt Comments"
Icon = ""
