name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The cross-check test runs the frontend scanner through node. Without it
      # that test skips, and the two halves stop being compared at all.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python test_strip_comments.py
